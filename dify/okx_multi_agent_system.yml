app:
  description: 'Полнофункциональный мульти-агентный комплекс OKX Trading Bot & Control Plane. Включает 6 специализированных агентов (Orchestrator, Hunter, Executor, Trader, Pump Risk Taker, Ops Sentinel), риск-контроль по AGENTS.md §2, интеграцию с CockroachDB Cloud (legion-pi) и OKX API.'
  icon: '📈'
  icon_background: '#FFE8D6'
  mode: advanced-chat
  name: 'OKX Multi-Agent Trading & Control Plane'
  use_icon_as_answer_icon: true
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables:
    - id: okx_domain
      name: OKX_DOMAIN
      value: 'www.okx.com'
      value_type: string
    - id: okx_mode
      name: OKX_MODE
      value: 'demo'
      value_type: string
    - id: cockroach_host
      name: COCKROACH_HOST
      value: 'legion-pi-21646.jxf.gcp-europe-west1.cockroachlabs.cloud'
      value_type: string
    - id: cockroach_db
      name: COCKROACH_DB
      value: 'defaultdb'
      value_type: string
    - id: cockroach_user
      name: COCKROACH_USER
      value: 'paul'
      value_type: string
  features:
    file_upload:
      image:
        enabled: true
        number_limits: 3
        transfer_methods:
          - all
    opening_statement: "🤖 **Добро пожаловать в OKX Multi-Agent Trading & Control Plane в Dify Cloud!**\n\nСистема полностью синхронизирована с репозиторием и регламентом проекта **`AGENTS.md`**.\n\n### 👥 Доступные агенты:\n1. 🎯 **Project Orchestrator** — автопилот доски `ops/board.md`, координация задач и передача claims.\n2. 🔍 **Crypto Insight Hunter** — исследование стратегий (Grid, Mean-Reversion, Trend, Carry), индикаторы и факт-чекинг.\n3. ⚡ **Insight Executor** — запуск тестов, проверка бэктестов, скрипты и интеграции.\n4. 💰 **OKX Trader** — спот и своп ордера, запуск/надзор нативных Grid и DCA ботов.\n5. 🚀 **Pump Risk Taker** — импульсные памп-сделки в пределах лимита кармана 10% эквити.\n6. 🛡️ **Ops Sentinel** — мониторинг торгового движка (PID 15744), контроль просадки и kill-switch.\n7. 🪳 **CockroachDB Cloud** — телеметрия и журнал событий в кластере `legion-pi`.\n\nЗадайте любой вопрос или выберите быстрое действие ниже 👇"
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
      - 'Ops Sentinel: проверь статус движка, баланс эквити и breakers'
      - 'Pump Risk Taker: проверь свежесть кандидатов и состояние кармана'
      - 'OKX Trader: покажи статус флота grid и DCA ботов на demo'
      - 'Project Orchestrator: покажи актуальные задачи на доске ops/board.md'
      - 'CockroachDB: проверь подключение к облачной телеметрии legion-pi'
    suggested_questions_after_answer:
      enabled: true
  graph:
    edges:
      - id: edge_start_to_classifier
        source: start_node
        target: classifier_node
      - id: edge_class_orchestrator
        source: classifier_node
        sourceHandle: class_orchestrator
        target: llm_orchestrator
      - id: edge_class_hunter
        source: classifier_node
        sourceHandle: class_hunter
        target: llm_hunter
      - id: edge_class_executor
        source: classifier_node
        sourceHandle: class_executor
        target: llm_executor
      - id: edge_class_trader
        source: classifier_node
        sourceHandle: class_trader
        target: risk_guard_node
      - id: edge_class_pump
        source: classifier_node
        sourceHandle: class_pump
        target: llm_pump
      - id: edge_class_sentinel
        source: classifier_node
        sourceHandle: class_sentinel
        target: llm_sentinel
      - id: edge_guard_to_trader
        source: risk_guard_node
        target: llm_trader
      - id: edge_orch_to_answer
        source: llm_orchestrator
        target: answer_node
      - id: edge_hunter_to_answer
        source: llm_hunter
        target: answer_node
      - id: edge_exec_to_answer
        source: llm_executor
        target: answer_node
      - id: edge_trader_to_answer
        source: llm_trader
        target: answer_node
      - id: edge_pump_to_answer
        source: llm_pump
        target: answer_node
      - id: edge_sentinel_to_answer
        source: llm_sentinel
        target: answer_node
    nodes:
      - id: start_node
        type: start
        data:
          title: 'Старт'
          desc: 'Входная точка пользовательского запроса'
          selected: false
          variables: []
      - id: classifier_node
        type: question-classifier
        data:
          title: 'Маршрутизатор агентов'
          desc: 'Определение роли и целевого агента на основе намерения пользователя'
          selected: false
          model:
            provider: openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0.1
          query_variable_selector:
            - sys
            - query
          classes:
            - id: class_orchestrator
              name: Project Orchestrator (доска задач, статус проекта, общая координация)
            - id: class_hunter
              name: Crypto Insight Hunter (исследования стратегий, индикаторы, анализ рынка)
            - id: class_executor
              name: Insight Executor (код, бэктесты, тесты, скрипты автоматизации)
            - id: class_trader
              name: OKX Trader (торговые ордера, grid/DCA боты, балансы, позиции)
            - id: class_pump
              name: Pump Risk Taker (памп-сканы, импульсные сделки, лимиты кармана)
            - id: class_sentinel
              name: Ops Sentinel (мониторинг движка, риск-ядро, breakers, CockroachDB телеметрия)
          instructions: 'Проанализируй запрос и выбери агента:
            - Если запрос про доску задач, roadmap, управление проектом -> Project Orchestrator
            - Если про анализ рынка, стратегии (RSI, BB, MACD, Trend, Carry), индикаторы -> Crypto Insight Hunter
            - Если про код, unit-тесты, скрипты, бэктестер -> Insight Executor
            - Если про выставление ордеров, покупку/продажу, запуск grid или dca ботов -> OKX Trader
            - Если про памп-сканы, импульсы, кандидатов памп-кармана -> Pump Risk Taker
            - Если про статус движка, баланс, эквити, kill-switch, риски, CockroachDB -> Ops Sentinel'
      - id: llm_orchestrator
        type: llm
        data:
          title: 'Project Orchestrator'
          desc: 'Ведёт доску ops/board.md, декомпозирует задачи, соблюдает регламент AGENTS.md'
          selected: false
          model:
            provider: openai
            name: gpt-4o
            mode: chat
            completion_params:
              temperature: 0.2
          prompt_template:
            - role: system
              text: 'Ты — Project Orchestrator, автопилот и координатор OKX-бота (AGENTS.md).
                Твоя ответственность:
                - Ведение единой доски ops/board.md и фазового плана insights/roadmap.md.
                - Цикл работы: SYNC -> CLAIM -> DO -> VERIFY -> RECORD -> NEXT.
                - Правило асимметрии безопасности: в сторону безопасности агент действует сам и сразу; в сторону риска (live, ослабление лимитов, вывод средств) — только человек (needs-user).
                - Вывод средств ЗАПРЕЩЁН ВСЕГДА.
                Отвечай на русском языке, структурированно, ссылайся на регламент AGENTS.md и текущие статусы доски.'
            - role: user
              text: '{{#sys.query#}}'
      - id: llm_hunter
        type: llm
        data:
          title: 'Crypto Insight Hunter'
          desc: 'Исследование стратегий, рынка, API и гипотез с подтверждением двумя источниками'
          selected: false
          model:
            provider: openai
            name: gpt-4o
            mode: chat
            completion_params:
              temperature: 0.3
          prompt_template:
            - role: system
              text: 'Ты — Crypto Insight Hunter в проекте OKX-бота (AGENTS.md).
                Твоя роль: исследование рыночных аномалий, торговых стратегий (Grid, DCA, Mean-Reversion, Trend Following, Funding Carry) и возможностей биржи OKX.
                Принципы:
                - Все ключевые факты и параметры проверяются минимум по 2 независимым источникам.
                - Стратегии проектируются с учётом anti-lookahead и walk-forward валидации.
                - Открытые вопросы оформляются как задачи для доски ops/board.md.
                Отвечай на русском языке с детальными расчётами формул и ссылками.'
            - role: user
              text: '{{#sys.query#}}'
      - id: llm_executor
        type: llm
        data:
          title: 'Insight Executor'
          desc: 'Разработчик: чистый код, 100% покрытие тестами, скрипты автоматизации'
          selected: false
          model:
            provider: openai
            name: gpt-4o
            mode: chat
            completion_params:
              temperature: 0.1
          prompt_template:
            - role: system
              text: 'Ты — Insight Executor в проекте OKX-бота (AGENTS.md).
                Твоя задача: написание кода в src/, тестов в tests/ и скриптов ops/*.ps1.
                Правила:
                - Любой новый функционал обязан иметь unit-тесты (в проекте 1060+ зелёных тестов).
                - Обратная совместимость и zero-breakage: нельзя ломать работающий движок.
                - Критерий готовности задачи на доске проверяется дословно перед переводом в done.
                Отвечай на русском языке, предлагай готовые фрагменты кода и команды проверки.'
            - role: user
              text: '{{#sys.query#}}'
      - id: risk_guard_node
        type: code
        data:
          title: 'Risk Guard & Pre-Trade Check'
          desc: 'Проверка торговых действий против риск-лимитов AGENTS.md §2'
          selected: false
          code_language: python3
          code: |
            def main(query: str) -> dict:
                q = query.lower()
                # Блокировка вывода средств (Withdraw)
                if "вывод" in q or "withdraw" in q:
                    return {
                        "allowed": False,
                        "reason": "КРИТИЧЕСКИЙ ОТКАЗ: Вывод средств агентам запрещён навсегда (AGENTS.md §2)."
                    }
                # Проверка включения реальной торговли
                if "live" in q and ("включи" in q or "запусти" in q or "переключи" in q):
                    return {
                        "allowed": False,
                        "reason": "Включение live-торговли требует задачи needs-user и подтверждения человека."
                    }
                # Проверка плеча (максимум 3x)
                if any(x in q for x in ["5x", "10x", "20x", "50x", "100x"]):
                    return {
                        "allowed": False,
                        "reason": "Превышение лимита плеча: по регламенту проекта максимум 3x (RISK-LEVERAGE-CAP)."
                    }
                return {
                    "allowed": True,
                    "reason": "Торговая операция в пределах риск-лимитов demo-режима."
                }
          variables:
            - value_selector:
                - sys
                - query
              variable: query
      - id: llm_trader
        type: llm
        data:
          title: 'OKX Trader'
          desc: 'Исполнение сделок, нативные grid/DCA боты, метки clOrdId с префиксом trd'
          selected: false
          model:
            provider: openai
            name: gpt-4o
            mode: chat
            completion_params:
              temperature: 0.1
          prompt_template:
            - role: system
              text: 'Ты — OKX Trader в проекте OKX-бота (AGENTS.md).
                Твоя ответственность:
                - Операции на бирже через okx CLI и REST/WebSocket API.
                - Спот и фьючерс ордера, запуск нативных grid и DCA ботов на demo-счёте.
                - Каждому ордеру/боту присваивается метка clOrdId с префиксом trd (ORDER-OWNER-TAG).
                - Режим аккаунта acctLv=2 (Spot and Futures), tdMode спота cash (заём запрещён).
                - Проверка вердикта Risk Guard: {{#risk_guard_node.reason#}}.
                Если Risk Guard вернул отказ — отклони операцию и объясни причину со ссылкой на AGENTS.md.
                Отвечай на русском языке со всеми параметрами (algoId, пара, диапазон, стоп-лосс).'
            - role: user
              text: 'Запрос пользователя: {{#sys.query#}}
                Вердикт Risk Guard: {{#risk_guard_node.allowed#}} ({{#risk_guard_node.reason#}})'
      - id: llm_pump
        type: llm
        data:
          title: 'Pump Risk Taker'
          desc: 'Рисковый памп-карман (10% эквити), проверка свежести PUMP-STALE (15 мин), префикс pmp'
          selected: false
          model:
            provider: openai
            name: gpt-4o
            mode: chat
            completion_params:
              temperature: 0.2
          prompt_template:
            - role: system
              text: 'Ты — Pump Risk Taker в проекте OKX-бота (AGENTS.md).
                Твоя специализация:
                - Рисковый карман импульсных сделок (бюджет 10% от общей эквити, max 3 позиции).
                - Жёсткое правило PUMP-STALE: вход разрешён только в течение 15 минут от закрытия сигнальной свечи сканера и если текущая цена >= цене закрытия свечи.
                - Две ступени тейк-профита (OCO) и стоп-лосс максимум 2% от входа. Префикс clOrdId — pmp.
                - Лимит потерь в день: 5% от бюджета кармана.
                Отвечай на русском языке с проверкой всех чисел против pump-pocket.json.'
            - role: user
              text: '{{#sys.query#}}'
      - id: llm_sentinel
        type: llm
        data:
          title: 'Ops Sentinel'
          desc: 'Мониторинг движка PID 15744, риск-ядра, кривой эквити, CockroachDB Cloud'
          selected: false
          model:
            provider: openai
            name: gpt-4o
            mode: chat
            completion_params:
              temperature: 0.1
          prompt_template:
            - role: system
              text: 'Ты — Ops Sentinel в проекте OKX-бота (AGENTS.md).
                Твоя задача:
                - Надзор за непрерывным 72-часовым прогоном движка (P1-72H, текущий процесс PID 15744).
                - Мониторинг эквити (~109k USDT), просадки (HWM breaker -15%) и серий убытков.
                - Мониторинг синхронизации с распределённой базой данных CockroachDB Cloud (кластер legion-pi, хост: legion-pi-21646.jxf.gcp-europe-west1.cockroachlabs.cloud:26257).
                - При возникновении расхождений или сбоев — фиксация инцидента в ops/incidents.md и применение защитных мер вплоть до kill-switch.
                Отвечай на русском языке с чёткими техническими метриками (код завершения, время работы, reconciles).'
            - role: user
              text: '{{#sys.query#}}'
      - id: answer_node
        type: answer
        data:
          title: 'Ответ'
          desc: 'Финальный вывод пользователю в чат'
          selected: false
          answer: '{{#llm_orchestrator.text#}}{{#llm_hunter.text#}}{{#llm_executor.text#}}{{#llm_trader.text#}}{{#llm_pump.text#}}{{#llm_sentinel.text#}}'
          variables: []
